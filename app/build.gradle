plugins {
    id 'com.android.application'
}

def projectDebugKeystore = file("${rootProject.projectDir}/debug.keystore")

android {
    namespace 'com.jyotishtrader.app'
    compileSdk 35

    signingConfigs {
        if (projectDebugKeystore.exists()) {
            debug {
                storeFile projectDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.jyotishtrader.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }

    buildTypes {
        debug {
            if (projectDebugKeystore.exists()) {
                signingConfig signingConfigs.debug
            }
        }
    }
}
